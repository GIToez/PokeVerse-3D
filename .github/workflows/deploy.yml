name: Deploy to OVH

# Save newer live admin edits onto main, then SSH as pokeverse@40.160.145.24
# and run scripts/live/deploy.sh. The save uses the script in this commit, so
# the reset cannot drop quests, NPCs, or maps that exist only on the server.
# Required secret: OVH_SSH_KEY (private key that logs in as pokeverse).
# Optional: OVH_HOST (default 40.160.145.24), OVH_USER (default pokeverse), OVH_PORT (22).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  deploy:
    name: Save live edits, then pull and restart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Save live edits before reset
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
        run: bash scripts/live/save-live-ci.sh

      - name: Stop if a newer live edit is still unsaved
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
        run: bash scripts/live/ssh-guard.sh

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.OVH_HOST || '40.160.145.24' }}
          username: ${{ secrets.OVH_USER || 'pokeverse' }}
          key: ${{ secrets.OVH_SSH_KEY }}
          port: ${{ secrets.OVH_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            export PV_SSH_USER="${{ secrets.OVH_USER || 'pokeverse' }}"
            export PV_APP_DIR="/opt/pokeverse-3d"
            cd "$PV_APP_DIR"
            bash "$PV_APP_DIR/scripts/live/deploy.sh"
