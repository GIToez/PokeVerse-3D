name: Deploy to OVH

# SSH as pokeverse@40.160.145.24 (same box as Open Tibia) and run scripts/live/deploy.sh.
# Required secret: OVH_SSH_KEY (private key that logs in as pokeverse).
# Optional: OVH_HOST (default 40.160.145.24), OVH_USER (default pokeverse), OVH_PORT (22).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull and restart pokeverse-3d
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.OVH_HOST || '40.160.145.24' }}
          username: ${{ secrets.OVH_USER || 'pokeverse' }}
          key: ${{ secrets.OVH_SSH_KEY }}
          port: ${{ secrets.OVH_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            export PV_SSH_USER="${{ secrets.OVH_USER || 'pokeverse' }}"
            export PV_APP_DIR="/opt/pokeverse-3d"
            bash "$PV_APP_DIR/scripts/live/deploy.sh"
