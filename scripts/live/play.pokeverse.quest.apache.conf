<VirtualHost *:80>
    ServerName play.pokeverse.quest
    DocumentRoot /opt/pokeverse-3d

    <Directory /opt/pokeverse-3d>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <DirectoryMatch "^/opt/pokeverse-3d/(server|tools|docs|upcoming|node_modules|\.git)(/|$)">
        Require all denied
    </DirectoryMatch>

    AddType application/javascript .mjs

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteRule ^/servidor/?(.*)$ ws://127.0.0.1:5190/$1 [P,L]
    ProxyPass /servidor http://127.0.0.1:5190
    ProxyPassReverse /servidor http://127.0.0.1:5190
    ProxyTimeout 3600

    RewriteRule ^/admin/?$ /admin/index.html [L]
    RewriteRule ^/admin/scenery/?$ /admin/scenery.html [L]
    RewriteRule ^/admin/cenario/?$ /admin/scenery.html [L]

    RewriteCond %{DOCUMENT_ROOT}/public%{REQUEST_URI} -f
    RewriteRule ^ /public%{REQUEST_URI} [L]
</VirtualHost>
